name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check flake
        run: nix flake check --impure

      - name: Build package
        run: nix build .

      - name: Run git-hooks (alejandra, stylua)
        run: nix develop --impure --command devenv test

      - name: Headless startup smoke test
        run: nix develop --impure --command nvim --headless -c 'qa!'
