name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: determinate-nix/setup-nix@v4

      - name: Check flake
        run: nix flake check

      - name: Build package
        run: nix build .

      - name: Format Nix files
        run: nix develop --command alejandra --check .

      - name: Format Lua files
        run: nix develop --command stylua --check init.lua lua after

      - name: Headless startup smoke test
        run: nix develop --command nvim --headless -c 'qa!'
