name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check flake
        run: nix flake check

      - name: Build package
        run: nix build .

      - name: Format Nix files
        run: nix fmt -- --check .

      - name: Format Lua files
        run: nix develop --command stylua --check init.lua lua after

      - name: Headless startup smoke test
        run: nix develop --command nvim --headless -c 'qa!'
